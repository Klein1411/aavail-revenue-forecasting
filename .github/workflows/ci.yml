name: test-and-docker-smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute unit and integration tests
        run: python run_tests.py
      - name: Train and render analysis
        run: |
          python -m src.train
          python -m src.plots
      - name: Smoke test Dockerized API
        run: |
          docker build -t aavail-capstone:ci .
          docker run -d --rm --name aavail-ci -p 127.0.0.1:18000:8000 aavail-capstone:ci
          trap 'docker logs aavail-ci; docker stop aavail-ci' EXIT
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18000/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18000/health
          curl --fail -X POST 'http://127.0.0.1:18000/predict?date=2025-03-01&country=France'
          curl --fail -X POST 'http://127.0.0.1:18000/predict?date=2025-03-01'
